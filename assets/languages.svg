<svg xmlns="http://www.w3.org/2000/svg" width="480" height="195" viewBox="0 0 480 195" role="img" aria-label="Language distribution across public repositories">
  <style>
    .seg { opacity: 0; animation: pop .55s ease-out forwards; }
    .s0 { animation-delay: 0.15s; }
    .s1 { animation-delay: 0.24s; }
    .s2 { animation-delay: 0.33s; }
    .s3 { animation-delay: 0.42s; }
    @keyframes pop { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <rect x="0.5" y="0.5" width="479" height="194" rx="10" fill="#0d1117" stroke="#26304a"/>
  <text x="24" y="34" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,sans-serif" font-size="15.5" font-weight="700" fill="#a78bfa">Languages</text>
  <text x="24" y="52" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#6b7280">by bytes written across public repos</text>
  <rect x="24" y="74" width="432" height="12" rx="2" fill="#161b22"/>
  <rect class="seg s0" x="24.00" y="74" width="221.33" height="12" rx="2" fill="#3572A5"/>
  <rect class="seg s1" x="246.83" y="74" width="169.95" height="12" rx="2" fill="#f1e05a"/>
  <rect class="seg s2" x="418.29" y="74" width="25.89" height="12" rx="2" fill="#563d7c"/>
  <rect class="seg s3" x="445.68" y="74" width="8.82" height="12" rx="2" fill="#e34c26"/>

  <g class="seg s0">
    <circle cx="30" cy="114" r="4.5" fill="#3572A5"/>
    <text x="42" y="118" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,sans-serif" font-size="12.5" fill="#e6edf3">Python</text>
    <text x="226" y="118" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Consolas,monospace" font-size="12" fill="#8b949e" text-anchor="end">51.6%</text>
  </g>
  <g class="seg s1">
    <circle cx="254" cy="114" r="4.5" fill="#f1e05a"/>
    <text x="266" y="118" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,sans-serif" font-size="12.5" fill="#e6edf3">JavaScript</text>
    <text x="450" y="118" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Consolas,monospace" font-size="12" fill="#8b949e" text-anchor="end">39.7%</text>
  </g>
  <g class="seg s2">
    <circle cx="30" cy="139" r="4.5" fill="#563d7c"/>
    <text x="42" y="143" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,sans-serif" font-size="12.5" fill="#e6edf3">CSS</text>
    <text x="226" y="143" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Consolas,monospace" font-size="12" fill="#8b949e" text-anchor="end">6.3%</text>
  </g>
  <g class="seg s3">
    <circle cx="254" cy="139" r="4.5" fill="#e34c26"/>
    <text x="266" y="143" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,sans-serif" font-size="12.5" fill="#e6edf3">HTML</text>
    <text x="450" y="143" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Consolas,monospace" font-size="12" fill="#8b949e" text-anchor="end">2.4%</text>
  </g>
</svg>
